name: flutter_secure_storage_linux
description: Linux implementation of flutter_secure_storage
repository: https://github.com/fl-start/flutter_secure_storage/tree/main/flutter_secure_storage_linux
version: 4.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.2.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
  # Tests run against the real OpenSSL library; the package ships no crypto.
  scomm_openpgp:
    git:
      url: https://github.com/scomm-ai/scomm-openpgp.git
      ref: b7177569eb4a38e38f4027c38f8864d79d1ca20f
      path: dart/scomm_openpgp

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      linux:
        pluginClass: FlutterSecureStorageLinuxPlugin
        dartPluginClass: FlutterSecureStorageLinux
