name: flutter_secure_storage_platform_interface
description: A common platform interface for the flutter_secure_storage plugin.
repository: https://github.com/fl-start/flutter_secure_storage/tree/main/flutter_secure_storage_platform_interface
version: 2.3.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.12
  very_good_analysis: ^7.0.0
  # Tests run against the real OpenSSL library; the package ships no crypto.
  scomm_openpgp:
    git:
      url: https://github.com/scomm-ai/scomm-openpgp.git
      ref: b7177569eb4a38e38f4027c38f8864d79d1ca20f
      path: dart/scomm_openpgp
