name: Desktop Smoke

on:
  push:
    branches: [master, main, develop]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  platform_interface_desktop:
    name: Desktop API / FSS1 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run platform interface desktop tests
        working-directory: flutter_secure_storage_platform_interface
        run: flutter test test/desktop

  windows_unit:
    name: Windows DPAPI + desktop key tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run Windows package tests
        working-directory: flutter_secure_storage_windows
        run: |
          flutter pub get
          flutter test
      - name: Report TPM status
        run: |
          echo "software tests passed"
          echo "mocked TPM tests passed (tpmAvailableOverride)"
          echo "physical TPM integration not available"

  linux_unit:
    name: Linux desktop key unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run Linux package tests (no keyring)
        working-directory: flutter_secure_storage_linux
        run: |
          flutter pub get
          flutter test

  linux_build:
    name: Linux plugin build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter Linux build deps (no libsecret required)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux example without libsecret-dev
        working-directory: flutter_secure_storage/example
        run: |
          flutter pub get
          flutter build linux --debug
      - name: Report optional TPM / soft libsecret
        run: |
          echo "software tests / build passed"
          echo "libsecret soft-loaded at runtime (not required to build)"
          echo "physical TPM integration not available"
          echo "TPM development headers not required for build"

  linux_build_with_libsecret:
    name: Linux plugin build (with libsecret present)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install libsecret + GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux example with libsecret installed
        working-directory: flutter_secure_storage/example
        run: |
          flutter pub get
          flutter build linux --debug

  macos_build:
    name: macOS plugin build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS example
        working-directory: flutter_secure_storage/example
        run: |
          flutter pub get
          flutter build macos --debug
