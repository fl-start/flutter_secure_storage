name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version Info
        run: flutter doctor -v

      - name: Cache Pub Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Workspace with Melos
        run: melos bootstrap

      - name: Lint Code
        run: melos analyze

  formatting:
    name: Formatting
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Workspace with Melos
        run: melos bootstrap

      - name: Check Code Formatting
        run: melos format --output none --set-exit-if-changed

  unit_tests_matrix:
    name: Dart unit (${{ matrix.package }})
    needs: formatting
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: flutter_secure_storage
            os: ubuntu-latest
            path: flutter_secure_storage
            coverage: true
          - package: platform_interface
            os: ubuntu-latest
            path: flutter_secure_storage_platform_interface
            coverage: false
          - package: linux
            os: ubuntu-latest
            path: flutter_secure_storage_linux
            coverage: false
          - package: windows
            os: windows-latest
            path: flutter_secure_storage_windows
            coverage: false
          - package: darwin
            os: macos-latest
            path: flutter_secure_storage_darwin
            coverage: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
        shell: bash

      - name: Bootstrap Workspace with Melos
        run: melos bootstrap
        shell: bash

      - name: Run Unit Tests
        working-directory: ${{ matrix.path }}
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            flutter test --coverage
          else
            flutter test
          fi
        shell: bash

      - name: Upload Coverage Report
        if: matrix.coverage == true
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: flutter_secure_storage/coverage/lcov.info

      - name: Upload Flutter Coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: flutter_secure_storage/coverage/lcov.info
          flags: flutter
          name: codecov-flutter
          fail_ci_if_error: false

  unit_tests_android:
    name: Android Unit Tests
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Example App (generates native build files)
        working-directory: flutter_secure_storage/example
        run: flutter build apk --debug

      - name: Run Android Unit Tests with Coverage
        working-directory: flutter_secure_storage/example/android
        run: ./gradlew :flutter_secure_storage:jacocoTestReport

      - name: Upload Android Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: flutter_secure_storage/android/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          name: codecov-android
          fail_ci_if_error: false

  desktop_smoke:
    name: Desktop smoke (${{ matrix.os }})
    needs: formatting
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop
        run: |
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
          flutter doctor -v

      - name: Pub get (example)
        working-directory: flutter_secure_storage/example
        run: flutter pub get

      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: flutter_secure_storage/example
        run: flutter build linux --debug

      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: flutter_secure_storage/example
        run: flutter build windows --debug

      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: flutter_secure_storage/example
        run: flutter build macos --debug

  publish_dry_run:
    name: pub publish --dry-run
    needs: [unit_tests_matrix, unit_tests_android]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Workspace with Melos
        run: melos bootstrap

      - name: Dry-run publish (platform_interface)
        working-directory: flutter_secure_storage_platform_interface
        run: flutter pub publish --dry-run

      - name: Dry-run publish (main package)
        working-directory: flutter_secure_storage
        run: flutter pub publish --dry-run || true
        # Main package may warn about path/git overrides in workspace; keep informative.

  integration_tests_android:
    name: Android Integration (API ${{ matrix.api-level }})
    needs: [unit_tests_matrix, unit_tests_android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.arch }}-v2

      - name: Create AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test
          working-directory: flutter_secure_storage/example

  integration_tests_ios:
    name: iOS Integration
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [unit_tests_matrix, unit_tests_android]

    env:
      SIM_OS: iOS
      SIM_OS_VERSION: "26.2"
      SIM_DEVICE: "iPhone 17"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set Up Simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os: ${{ env.SIM_OS }}
          os_version: ${{ env.SIM_OS_VERSION }}
          model: ${{ env.SIM_DEVICE }}
          erase_before_boot: true
          wait_for_boot: true

      - name: Install Dependencies
        working-directory: flutter_secure_storage/example
        run: flutter pub get

      - name: Run Integration Tests
        working-directory: flutter_secure_storage/example
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          echo "Using simulator: $DEVICE_ID"
          flutter test integration_test/app_test.dart -d "$DEVICE_ID" --verbose
